[workspace]
resolver = "2"
members = [
    "crates/codemorph-core",
    "crates/codemorph-ir",
    "crates/codemorph-sandbox",
    "crates/codemorph-cpp",
    "crates/codemorph-rustlang",
    "crates/codemorph-cli",
    "crates/codemorph-models",
    "crates/codemorph-verify",
    "crates/codemorph-project",
    "crates/codemorph-orchestrate",
]
default-members = ["crates/codemorph-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license-file = "LICENSE"
authors = ["CodeMorph contributors"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.13"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wait-timeout = "0.2"
which = "6.0"
nix = "0.29"
sha2 = "0.10"